<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타이머</title>
<style>
:root{
  --bg:#eaf0f3; --ink:#14303b; --sub:#5b7380; --track:#cbd8df; --accent:#1f7a6d; --warn:#c2410c; --btn:#14303b; --btn-ink:#fff; --chip:#d9e4ea;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#10222a; --ink:#e6f0f4; --sub:#8fa8b4; --track:#25404b; --accent:#4cc3b0; --warn:#ff9b6a; --btn:#e6f0f4; --btn-ink:#10222a; --chip:#1c3641; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
main{width:100%;max-width:360px;text-align:center}
.dial{position:relative;width:min(80vw,300px);aspect-ratio:1;margin:0 auto 24px}
svg{width:100%;height:100%;transform:rotate(-90deg)}
circle{fill:none;stroke-width:10;stroke-linecap:round}
.track{stroke:var(--track)}
#bar{stroke:var(--accent);transition:stroke-dashoffset .25s linear}
.done #bar{stroke:var(--warn)}
#time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(44px,15vw,64px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.done #time{color:var(--warn)}
.set{display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:14px}
.set input{width:76px;padding:10px;font:inherit;font-size:18px;text-align:center;border:2px solid var(--track);border-radius:10px;background:transparent;color:var(--ink)}
.set label{color:var(--sub);font-size:14px}
.chips{display:flex;gap:8px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
.chips button{padding:8px 14px;border:0;border-radius:999px;background:var(--chip);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.row{display:flex;gap:10px;justify-content:center}
.row button{min-width:110px;padding:14px 20px;border-radius:12px;font:inherit;font-size:17px;font-weight:600;cursor:pointer;border:2px solid var(--btn)}
#go{background:var(--btn);color:var(--btn-ink)}
#reset{background:transparent;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#bar{transition:none}}
</style>
</head>
<body>
<main id="app">
  <div class="dial">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="track" cx="60" cy="60" r="54"/>
      <circle id="bar" cx="60" cy="60" r="54"/>
    </svg>
    <div id="time" role="timer" aria-live="off">05:00</div>
  </div>
  <div class="set">
    <input id="min" type="number" min="0" max="999" value="5" aria-label="분">
    <label for="min">분</label>
    <input id="sec" type="number" min="0" max="59" value="0" aria-label="초">
    <label for="sec">초</label>
  </div>
  <div class="chips">
    <button data-m="1">1분</button><button data-m="5">5분</button><button data-m="10">10분</button><button data-m="25">25분</button>
  </div>
  <div class="row">
    <button id="go">시작</button>
    <button id="reset">초기화</button>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const C = 2 * Math.PI * 54;
const bar = $('bar'), timeEl = $('time'), app = $('app'), go = $('go');
bar.style.strokeDasharray = C;
let total = 300, left = 300, endAt = 0, tick = null, running = false;

const fmt = s => {
  const m = Math.floor(s / 60), r = s % 60;
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
};
function draw(){
  timeEl.textContent = fmt(left);
  bar.style.strokeDashoffset = total ? C * (1 - left / total) : 0;
  document.title = running ? fmt(left) + ' · 타이머' : '타이머';
}
function readInputs(){
  const m = Math.max(0, parseInt($('min').value) || 0);
  const s = Math.min(59, Math.max(0, parseInt($('sec').value) || 0));
  return m * 60 + s;
}
function setTime(sec){
  stop();
  total = left = sec;
  app.classList.remove('done');
  go.textContent = '시작';
  draw();
}
function stop(){ clearInterval(tick); running = false; }
function beep(){
  try{
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(t => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(.2, ac.currentTime + t);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + t + .3);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .3);
    });
  }catch(e){}
}
function update(){
  left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
  if (left === 0){
    stop(); app.classList.add('done'); go.textContent = '다시 시작'; beep();
  }
  draw();
}
go.onclick = () => {
  if (running){ stop(); go.textContent = '계속'; draw(); return; }
  if (left === 0 || app.classList.contains('done')) setTime(total);
  if (left === total && !running){ const s = readInputs(); if (s > 0 && s !== total) total = left = s; }
  if (left <= 0) return;
  endAt = Date.now() + left * 1000;
  running = true; go.textContent = '일시정지';
  tick = setInterval(update, 200);
  draw();
};
$('reset').onclick = () => setTime(readInputs() || 300);
['min','sec'].forEach(id => $(id).oninput = () => { if (!running) setTime(readInputs()); });
document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
  $('min').value = b.dataset.m; $('sec').value = 0; setTime(b.dataset.m * 60);
});
draw();
</script>
</body>
</html>
